<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Assistant | Internal Stats</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .stats-container {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .stat-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .stat-card:last-child {
            border-bottom: none;
        }
        .stat-label {
            font-size: 16px;
            color: #86868b;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #0071e3;
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #e5e5ea;
            border-radius: 6px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #0071e3;
            width: 0%;
            transition: width 1s ease-in-out;
        }
        .refresh-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .refresh-btn:hover {
            background: #0077ed;
        }
        .back-link {
            margin-top: 20px;
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="stats-container">
        <h1>📊 Dataset Processing Stats</h1>
        
        <div class="stat-card">
            <span class="stat-label">Total Papers Ingested</span>
            <span class="stat-value" id="total-papers">-</span>
        </div>
        
        <div class="stat-card">
            <span class="stat-label">Text Extracted</span>
            <span class="stat-value" id="processed-text">-</span>
        </div>
        
        <div class="stat-card">
            <span class="stat-label">Metadata (LLM) Extracted</span>
            <span class="stat-value" id="processed-metadata">-</span>
        </div>
        
        <div class="stat-card">
            <span class="stat-label">Verified DOIs (Crossref)</span>
            <span class="stat-value" id="verified-dois">-</span>
        </div>

        <div style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between;">
                <span class="stat-label">Completion Progress</span>
                <span class="stat-value" id="percent-complete">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <button class="refresh-btn" onclick="fetchStats()">Update Stats</button>
    </div>
    
    <a href="/ui/" class="back-link">← Back to Assistant</a>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('total-papers').textContent = data.total_papers;
                document.getElementById('processed-text').textContent = data.processed_text;
                document.getElementById('processed-metadata').textContent = data.processed_metadata;
                document.getElementById('verified-dois').textContent = data.verified_dois;
                document.getElementById('percent-complete').textContent = data.percent_complete + '%';
                document.getElementById('progress-fill').style.width = data.percent_complete + '%';
                
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }
        
        // Initial fetch
        fetchStats();
        // Auto refresh every 30 seconds
        setInterval(fetchStats, 30000);
    </script>
</body>
</html>
